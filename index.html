*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:82px}body{margin:0;background:#080808;color:var(--paper);font-family:'Crimson Pro',Georgia,serif;font-size:19px;line-height:1.65}a{color:inherit}.background-image{position:fixed;inset:0;z-index:-3;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.68)),url('asset/Cité%20gothique%20sous%20la%20lune%20de%20sang.png') center/cover no-repeat;filter:grayscale(1)}.film-grain{position:fixed;inset:0;z-index:-2;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.36),transparent 20%,transparent 80%,rgba(0,0,0,.36));opacity:.9}
.top-nav{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:center;gap:0;padding:0 12px;background:rgba(7,7,7,.96);border-bottom:1px solid rgba(174,55,48,.7);box-shadow:0 8px 24px #0008;backdrop-filter:blur(10px)}.top-nav a{position:relative;display:flex;align-items:center;justify-content:center;min-height:54px;padding:0 clamp(9px,1.5vw,22px);color:#d8cbb8;text-decoration:none;font:11px 'Cinzel',serif;letter-spacing:.045em;text-align:center;border-right:1px solid rgba(230,219,199,.09);transition:color .2s,background .2s;white-space:nowrap}.top-nav a:first-child{border-left:1px solid rgba(230,219,199,.09)}.top-nav a:after{content:'';position:absolute;left:15px;right:100%;bottom:0;height:2px;background:var(--red2);transition:right .25s}.top-nav a:hover,.top-nav a:focus-visible{color:#fff0db;background:rgba(130,28,28,.13)}.top-nav a:hover:after,.top-nav a:focus-visible:after{right:15px}.audio{position:fixed;right:18px;top:64px;z-index:20;display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);background:rgba(8,8,8,.9);box-shadow:0 8px 30px #0008;font:10px 'Cinzel',serif;letter-spacing:.12em}.audio button{background:transparent;color:var(--paper);border:1px solid var(--line);width:32px;height:32px;cursor:pointer}.audio small{display:block;color:var(--muted);font-size:9px}.hero{min-height:100svh;position:relative;display:grid;place-items:center;overflow:hidden;border-bottom:1px solid var(--line);background:linear-gradient(0deg,#080808 0%,rgba(0,0,0,.2) 35%,rgba(0,0,0,.22) 70%,#080808 100%)}.hero:before{content:"";position:absolute;inset:22px;border:1px solid rgba(173,59,50,.3);pointer-events:none}.hero-art{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}.hero-art img{width:100%;height:100%;object-fit:cover;filter:none;opacity:1}.hero-content{position:relative;text-align:center;width:min(900px,90vw);padding:80px 24px 100px}.eyebrow,.piece-kicker,.meta,.hero-bottom{font-family:'Cinzel',serif;letter-spacing:.18em;text-transform:uppercase}.eyebrow{color:var(--red2);font-size:12px}.hero h1{font-family:'Cinzel',serif;font-size:clamp(42px,8vw,90px);line-height:1.08;font-weight:500;margin:20px 0;color:#eadcc7;text-shadow:0 4px 22px #000}.hero h1 span{color:var(--red2)}.hero-sub{font-size:clamp(17px,2.5vw,23px);color:#d1c3af;max-width:640px;margin:0 auto 26px}.hero-stamp{display:inline-block;border:1px solid var(--red2);color:#e45b50;padding:7px 16px;transform:rotate(-2deg);font:12px 'Cinzel',serif;letter-spacing:.15em}.scroll-cue{position:absolute;bottom:35px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:#d64a42;font:10px 'Cinzel',serif;letter-spacing:.18em;white-space:nowrap}.scroll-cue .arrow{font:34px Georgia;animation:bob 1.6s infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}.hero-bottom{position:absolute;bottom:12px;left:5%;right:5%;display:flex;justify-content:space-between;gap:12px;color:#a99a85;font-size:9px}
main{width:min(980px,92vw);margin:0 auto;padding:56px 0 80px}.index-box,.piece{border:1px solid var(--line);background:var(--panel);box-shadow:0 20px 70px #0006;position:relative}.index-box{position:relative;padding:clamp(20px,3vw,32px);margin:28px 0 38px;border:1px solid rgba(220,205,180,.48);background:linear-gradient(135deg,rgba(8,8,8,.94),rgba(19,13,12,.91) 52%,rgba(5,5,5,.96));box-shadow:0 18px 55px #0009,inset 0 0 0 4px rgba(0,0,0,.35),inset 0 0 30px rgba(0,0,0,.25);isolation:isolate}.index-box:before{content:"";position:absolute;inset:8px;border:1px solid rgba(230,219,199,.2);pointer-events:none;z-index:-1;background:linear-gradient(var(--red2),var(--red2)) left top/28px 1px no-repeat,linear-gradient(var(--red2),var(--red2)) left top/1px 28px no-repeat,linear-gradient(var(--red2),var(--red2)) right top/28px 1px no-repeat,linear-gradient(var(--red2),var(--red2)) right top/1px 28px no-repeat,linear-gradient(var(--red2),var(--red2)) left bottom/28px 1px no-repeat,linear-gradient(var(--red2),var(--red2)) left bottom/1px 28px no-repeat,linear-gradient(var(--red2),var(--red2)) right bottom/28px 1px no-repeat,linear-gradient(var(--red2),var(--red2)) right bottom/1px 28px no-repeat}.section-heading{display:flex;align-items:center;gap:13px;margin:0 0 18px;padding:0 0 14px;border-bottom:1px solid rgba(174,55,48,.48);font:clamp(20px,3vw,27px) 'Cinzel',serif;letter-spacing:.08em;text-transform:uppercase}.roman{color:var(--red2);font-size:1.05em}.toc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 24px}.toc a{position:relative;display:flex;align-items:center;gap:12px;min-width:0;padding:15px 4px;border:0;border-bottom:1px solid rgba(220,205,180,.13);background:transparent;text-decoration:none;transition:color .25s ease,background .25s ease;white-space:normal}.toc a:after{content:"";position:absolute;left:0;right:100%;bottom:-1px;height:1px;background:linear-gradient(90deg,var(--red2),rgba(209,75,64,.12));box-shadow:0 0 9px rgba(209,75,64,.35);transition:right .28s ease}.toc a:hover{background:linear-gradient(90deg,rgba(130,28,28,.12),transparent);border-color:rgba(220,205,180,.13);transform:none;color:#fff0db}.toc a:hover:after,.toc a:focus-visible:after{right:0}.toc b{flex:0 0 auto;color:var(--red2);font:12px 'Cinzel',serif;letter-spacing:.08em}.toc span{font:500 13px 'Cinzel',serif;letter-spacing:.015em;color:#d8cbb8}.toc a:hover span{color:#f0dfc7}.piece{margin:28px 0;padding:clamp(28px,4vw,48px);scroll-margin-top:82px;isolation:isolate;overflow:hidden;border:1px solid rgba(220,205,180,.48);background:linear-gradient(135deg,rgba(22,20,18,.94),rgba(7,7,7,.94) 55%,rgba(22,15,14,.94)),repeating-linear-gradient(0deg,rgba(230,219,199,.025) 0 1px,transparent 1px 4px);box-shadow:0 20px 70px #0008,inset 0 0 0 4px rgba(0,0,0,.35),inset 0 0 35px rgba(0,0,0,.25)}.piece:before{content:"";position:absolute;inset:9px;border:1px solid rgba(230,219,199,.22);pointer-events:none;z-index:-1;background:linear-gradient(var(--red),var(--red)) left top/22px 1px no-repeat,linear-gradient(var(--red),var(--red)) left top/1px 22px no-repeat,linear-gradient(var(--red),var(--red)) right top/22px 1px no-repeat,linear-gradient(var(--red),var(--red)) right top/1px 22px no-repeat,linear-gradient(var(--red),var(--red)) left bottom/22px 1px no-repeat,linear-gradient(var(--red),var(--red)) left bottom/1px 22px no-repeat,linear-gradient(var(--red),var(--red)) right bottom/22px 1px no-repeat,linear-gradient(var(--red),var(--red)) right bottom/1px 22px no-repeat}.piece:after{content:"";position:absolute;left:0;top:32px;bottom:32px;width:2px;background:linear-gradient(transparent,var(--red),transparent);opacity:.9;pointer-events:none}.piece-kicker{font-size:10px;color:var(--red2);margin-bottom:6px}.piece h2{font:clamp(24px,4vw,36px)/1.25 'Cinzel',serif;font-weight:500;margin:0 0 24px;padding-bottom:18px;border-bottom:1px solid var(--line)}.piece h3{font:18px 'Cinzel',serif;color:#e2cdb0;margin:26px 0 9px}.piece p{margin:12px 0}.quote{font-style:italic;color:#d8c6ae;border-left:2px solid var(--red);padding:9px 18px;margin:20px 0;background:#0004}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px}.fact{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.09)}.fact strong{display:block;color:#b94b42;font:10px 'Cinzel',serif;letter-spacing:.13em;text-transform:uppercase}.fact span{display:block;font-size:19px}.list{padding-left:22px}.list li{padding:5px 0}.sublist{padding-left:24px;margin:4px 0}.closing{border-color:rgba(201,61,53,.8)}.back-top{display:block;text-align:center;text-decoration:none;color:#d64a42;font:11px 'Cinzel',serif;letter-spacing:.16em;padding:20px}.back-top:hover{color:#f2d9c0}footer{text-align:center;color:#a99984;font:10px 'Cinzel',serif;letter-spacing:.15em;padding:22px 0;border-top:1px solid var(--line)}
@media(max-width:760px){.top-nav{justify-content:flex-start;overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--red) #090909}.top-nav a{flex:0 0 auto;min-height:48px;padding:0 13px;font-size:10px}.audio{top:56px;right:8px}.audio .track{display:none}}@media(max-width:600px){body{font-size:18px}.hero-bottom{font-size:7px;letter-spacing:.08em}.facts{grid-template-columns:1fr}.piece{padding:22px 18px}.hero:before{inset:10px}}
