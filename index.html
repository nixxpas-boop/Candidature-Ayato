<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="Dossier confidentiel — Candidature Ayato, archives d'Owari no Seraph.">
  <title>Dossier Ayato — Archives confidentielles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Crimson+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=ayato-player-fix-2">
</head>
<body>
  <div class="background-image" aria-hidden="true"></div>
  <div class="film-grain" aria-hidden="true"></div>

  <aside class="archive-audio" aria-label="Lecteur audio des archives">
    <span class="audio-seal" aria-hidden="true">♫</span>
    <div class="audio-details"><span class="audio-label">BANDE SONORE</span><span class="audio-track">Misty Mountain Cold</span></div>
    <audio id="ayato-audio" preload="metadata" loop src="asset/Misty%20Mountain%20Cold%20Lyrics.mp3"></audio>
    <button class="audio-toggle" id="audio-toggle" type="button" aria-label="Lire la musique" title="Lire la musique"><span class="audio-icon">▶</span></button>
    <span class="audio-status" id="audio-status">EN PAUSE</span>
  </aside>

  <main class="site-shell is-visible" id="site">
    <section class="hero" id="accueil">
      <div class="hero-art" aria-hidden="true"><img src="asset/Cité gothique sous la lune de sang.png" alt=""></div><div class="hero-shade"></div>
      <div class="hero-content hero-content-image">
        <img class="hero-title-image" src="asset/Titre gothique rouge _ Ayato, dossier confidentiel.png" alt="Owari no Seraph — Candidature Ayato, dossier personnel et archives confidentielles">
      </div>
      <div class="hero-side-note">ARCHIVE N° 001 / ACCÈS RESTREINT</div>
      <div class="hero-bottom"><span>CLASSIFICATION : CONFIDENTIEL</span><span>ARCHIVES — SECTION SPÉCIALE</span><span>ÉDITION 01</span></div>
    </section>
  </main>

  <script>
    (() => {
      const audio = document.getElementById("ayato-audio");
      const button = document.getElementById("audio-toggle");
      const icon = button.querySelector(".audio-icon");
      const status = document.getElementById("audio-status");
      audio.volume = 0.14;
      button.addEventListener("click", async () => {
        if (audio.paused) {
          try { await audio.play(); } catch (e) { status.textContent = "INDISPONIBLE"; }
        } else { audio.pause(); }
      });
      audio.addEventListener("play", () => { icon.textContent = "Ⅱ"; button.setAttribute("aria-label", "Mettre la musique en pause"); button.title = "Mettre la musique en pause"; status.textContent = "LECTURE"; button.classList.add("is-playing"); });
      audio.addEventListener("pause", () => { icon.textContent = "▶"; button.setAttribute("aria-label", "Lire la musique"); button.title = "Lire la musique"; status.textContent = "EN PAUSE"; button.classList.remove("is-playing"); });
      audio.addEventListener("error", () => { status.textContent = "FICHIER INTROUVABLE"; });
    })();
  </script>
</body>
</html>
